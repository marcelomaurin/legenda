name: tests

on:
  push:
    branches: ["fila", "modernizacao-v2"]
  pull_request:

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testes unitários sem dependências pesadas
        run: python -m unittest discover -s tests -p "test_*.py"
