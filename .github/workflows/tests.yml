name: tests

on:
  push:
    branches: ["fila", "modernizacao-v2"]
  pull_request:

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar sintaxe dos scripts
        run: python -m py_compile bin/*.py

      - name: Validar configurações de exemplo
        run: |
          python -m json.tool config.example.json >/dev/null
          python -m json.tool instances.example.json >/dev/null
          python -m json.tool nodes.example.json >/dev/null

      - name: Testes unitários sem dependências pesadas
        run: python -m unittest discover -s tests -p "test_*.py"
